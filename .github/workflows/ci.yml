name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 静态门禁
        run: |
          python -m pip install --quiet pyyaml
          python -m compileall -q tools tests
          python tools/yaml_gate.py
          python - <<'PY'
          import ast,sys
          for f in ("tools/engine_probe.py","tests/test_engine_probe.py",
                    "tools/toolbelt_pins.py","tests/test_toolbelt_pins.py",
                    "tools/catalog_snapshot.py","tests/test_catalog_snapshot.py"):
              ast.parse(open(f,encoding="utf-8").read())
          print("AST ok")
          PY
      - name: 单测（夹具为 2026-10-18 真实 API 捕获）
        # -W 归解释器管，放到 unittest 参数上会直接 "unrecognized arguments"
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py" -v
      - name: 离线跑一遍发现器
        run: python tools/engine_probe.py --fixtures tests/fixtures --require-gpu --json /tmp/manifest.json
      - name: 离线回放工具带钉表
        run: python tools/toolbelt_pins.py --fixtures tests/fixtures --check pins/toolbelt.json
      - name: 离线校验目录快照的规则还认得上游形状
        run: python tools/catalog_snapshot.py --fixtures tests/fixtures --check
      - name: 产物清单落盘
        run: |
          head -c 600 /tmp/manifest.json
          python - <<'PY'
          import json
          m=json.load(open("/tmp/manifest.json"))
          assert m["counts"]["llama"]>0 and m["counts"]["whisper"]>0 and m["counts"]["sd"]>0, m["counts"]
          print("三家均可解析：",m["counts"])
          PY
