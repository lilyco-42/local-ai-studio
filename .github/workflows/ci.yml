name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: 静态门禁
        run: |
          python -m pip install --quiet pyyaml
          python -m compileall -q tools tests
          python tools/yaml_gate.py
          python tools/bash_gate.py
          python tools/citation_check.py --selftest
          python tools/action_pins.py --selftest
          python tools/lane_argv.py --selftest
          python tools/lane_argv.py
          python tools/sideload_lookup.py --selftest
          python tools/sideload_lookup.py --check
          python tools/backends.py --selftest
          python tools/backends.py --check
          python tools/backend_choice.py --selftest
          python tools/backend_choice.py --check
          python tools/runtime_parity.py --selftest
          python tools/runtime_parity.py --check
          python tools/runtime_versions.py --selftest
          python tools/runtime_versions.py --check
          python tools/shell_contract.py --selftest
          python tools/shell_contract.py --check
          python tools/shell_source.py --selftest
          python tools/shell_source.py --check
          python - <<'PY'
          import ast,sys
          for f in ("tools/engine_probe.py","tests/test_engine_probe.py",
                    "tools/toolbelt_pins.py","tests/test_toolbelt_pins.py",
                    "tools/catalog_snapshot.py","tests/test_catalog_snapshot.py"):
              ast.parse(open(f,encoding="utf-8").read())
          print("AST ok")
          PY
      - name: 出包路径上每个第三方 action 都必须钉 40 位 SHA（离线那层）
        # 这一条是给"只能靠 GitHub Actions 出包"这句硬约束兜底的：以前 4 个 uses: 全是
        # 浮动大版本 tag（v4/v5），别人的仓库推一个 tag 就能改变我们出包时跑什么。
        run: python tools/action_pins.py --offline
      - name: 单测（夹具为 2026-10-18 真实 API 捕获）
        # -W 归解释器管，放到 unittest 参数上会直接 "unrecognized arguments"
        # 带 GITHUB_TOKEN：有一条用例要真取 action.yml 复核形状，匿名 60 次/小时会整片跳过
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py" -v
      - name: 离线跑一遍发现器
        run: python tools/engine_probe.py --fixtures tests/fixtures --require-gpu --json /tmp/manifest.json
      - name: 离线回放工具带钉表
        run: python tools/toolbelt_pins.py --fixtures tests/fixtures --check pins/toolbelt.json
      - name: 离线校验目录快照的规则还认得上游形状
        run: python tools/catalog_snapshot.py --fixtures tests/fixtures --check
      - name: 产物清单落盘
        run: |
          head -c 600 /tmp/manifest.json
          python - <<'PY'
          import json
          m=json.load(open("/tmp/manifest.json"))
          assert m["counts"]["llama"]>0 and m["counts"]["whisper"]>0 and m["counts"]["sd"]>0, m["counts"]
          print("三家均可解析：",m["counts"])
          PY
