name: 出包（引擎负载与逐文件清单）
# 这一条只做"引擎负载"，不是最终的桌面安装包 —— 外壳已写（shell.yml），但安装包车道还没写。
# 但它把两件必须先有真东西的东西产出来：
# ① 每个 OS 默认档实际要带的文件清单（含逐文件 sha256 与体积），外壳运行时按这份清单校验引擎；
# ② `payload_plan` 里那些 `needs_extract` 的行（llama/whisper 的 Linux/macOS 包是 tar.gz，
#    中央目录读不出来）在这里被真正解开答出来 —— 之前只能标"不知道"；
# ③ 一份首启交付清单：每个文件落到用户机器的相对路径与对象键（只生成，不上传）。
# 下载与解包只发生在 runner 上：本机的硬约束是不编译不运行，连下载解包都不在这台机器做。
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/pack_engine.py"
      - "tools/payload_plan.py"
      - "tools/engine_probe.py"
      - "tools/stage_payload.py"
      - "tools/payload_intake.py"
      - "shell/core/src/delivery.rs"
      - "shell/core/examples/install_from_dir.rs"
      - "pins/payload-plan.json"
      - "pins/shell-contract.json"
      - ".github/workflows/package.yml"

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  engine-payload:
    strategy:
      fail-fast: false
      matrix:
        os_tag: [win-x64, linux-x64, macos-arm64]
    timeout-minutes: 25
    # 取包与解包和"目标 OS"无关（zip / tar.gz 在 ubuntu 上都能正确读），
    # 所以这里不用 mac/windows runner —— 它们更慢且有配额问题。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: 离线对照（合成 zip 与 tar.gz，证明收集规则不是永远绿）
        run: python3 tools/pack_engine.py --selfcheck
      # 按钉值打包，不现场追最新：外壳运行时下载的就是 payload-plan 里那一颗，
      # 现场取"最新"会让车道在上游每次发版时红，而产出的负载也不是外壳会认的那一份。
      # 上游发新版是 upstream-follow 车道的报告项，重钉是一次显式提交。
      - name: 钉值就是输入（这次要打哪些产物、每颗的 sha256 全在已提交的表里）
        env:
          OS_TAG: ${{ matrix.os_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          plan = json.load(open("pins/payload-plan.json", encoding="utf-8"))
          rows = [r for r in plan["os"][os.environ["OS_TAG"]]
                  if r.get("status") in ("ok", "needs_extract")]
          if not rows:
              raise SystemExit(f"{os.environ['OS_TAG']}: 钉值里一个可打包的产物都没有")
          for r in rows:
              print(f"{r['capability']}: {r['engine']} {r['release']} {r['asset']} {r['digest']}")
          PY
      - name: 下载 → 校上游 digest → 解包 → 逐文件清单
        run: python3 tools/pack_engine.py --plan pins/payload-plan.json --os "${{ matrix.os_tag }}" --out "dist/${{ matrix.os_tag }}"
      - name: 清单要自洽，且负载目录里不许留压缩包
        env:
          OS_TAG: ${{ matrix.os_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          d = os.path.join("dist", os.environ["OS_TAG"])
          doc = json.load(open(os.path.join(d, "payload-manifest.json"), encoding="utf-8"))
          rows = doc["engines"]
          print(f"{os.environ['OS_TAG']}: {len(rows)} 个引擎，合计 {doc['total_shipped_mib']} MiB")
          if not rows:
              raise SystemExit("一个引擎都没落成，这不能算出包")
          for e in rows:
              if e["status"] != "ok":
                  raise SystemExit(f"{e['engine']} 状态是 {e['status']}，不是 ok")
              files = {f["file"] for f in e["files"]}
              if not any(re.match(r"^(llama-server|whisper-cli|sd-cli|llama-cli|whisper-server|sd-server)(\.exe)?$", f)
                         for f in files):
                  raise SystemExit(f"{e['engine']}: 清单里没有主二进制 {sorted(files)[:6]}")
              for f in e["files"]:
                  if not re.fullmatch(r"[0-9a-f]{64}", f["sha256"]) or not f["bytes"]:
                      raise SystemExit(f"{e['engine']}: {f['file']} 的哈希/体积不完整")
          leftover = [n for n in os.listdir(d) if n.endswith((".zip", ".tar.gz", ".gz"))]
          if leftover:
              raise SystemExit(f"负载目录里还留着压缩包 {leftover} —— 装机包里不该有二次解包")
          print("  每个引擎都有主二进制与逐文件 sha256，目录里没有残留压缩包")
          PY
      - name: 摆进外壳认的 runtime 目录（目标只从合同派生，不执行任何二进制）
        env:
          OS_TAG: ${{ matrix.os_tag }}
        run: |
          set -euo pipefail
          python3 tools/stage_payload.py --package "dist/${OS_TAG}" --data "/tmp/root-${OS_TAG}" --os "${OS_TAG}" --json "/tmp/stage-${OS_TAG}.json"
          python3 tools/stage_payload.py --check --package "dist/${OS_TAG}" --data "/tmp/root-${OS_TAG}" --os "${OS_TAG}"
      - name: 生成首启交付清单（逐文件 key + sha256；不上传、不执行）
        env:
          OS_TAG: ${{ matrix.os_tag }}
        run: |
          set -euo pipefail
          python3 tools/payload_intake.py --data "/tmp/root-${OS_TAG}" --os "${OS_TAG}" \
            --out "dist/${OS_TAG}/delivery-manifest.json"
          python3 tools/payload_intake.py --check --data "/tmp/root-${OS_TAG}" --os "${OS_TAG}" \
            --out "dist/${OS_TAG}/delivery-manifest.json"
      # 消费端重放：发布方把文件按对象键摆成"桶"，然后**删掉生产者那棵树**，
      # 让安装只能读对象目录 —— 证明它没有偷看数据根、只凭清单就能还原。
      # 只有 linux-x64 能在 ubuntu runner 上真执行；win/mac 的产物只能装不能起。
      - name: 消费端重放：清单 → 空数据根 → 从装好的树起 llama-server（仅 linux-x64）
        if: matrix.os_tag == 'linux-x64'
        env:
          OS_TAG: ${{ matrix.os_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil
          tag = os.environ["OS_TAG"]
          with open(f"dist/{tag}/delivery-manifest.json", encoding="utf-8") as fh:
              intake = json.load(fh)
          root = f"/tmp/root-{tag}"
          objects = f"/tmp/objects-{tag}"
          rows = intake["files"] + [intake["manifest"]]
          for row in rows:
              dst = os.path.join(objects, row["key"])
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copyfile(os.path.join(root, row["dest"]), dst)
          print(f"对象目录：{len(rows)} 个键（含根清单）")
          PY
          rm -rf "/tmp/root-${OS_TAG}"
          cargo run --quiet --manifest-path shell/core/Cargo.toml \
            --example install_from_dir -- \
            --manifest "dist/${OS_TAG}/delivery-manifest.json" \
            --objects "/tmp/objects-${OS_TAG}" \
            --data "/tmp/installed-${OS_TAG}" --os "${OS_TAG}"
          test -f "/tmp/installed-${OS_TAG}/payload-manifest.json"
          SRV=$(find "/tmp/installed-${OS_TAG}/runtime" -type f -name llama-server | head -1)
          test -n "$SRV" || { echo "装好的树里没有 llama-server"; find "/tmp/installed-${OS_TAG}" -maxdepth 4 -type d; exit 1; }
          chmod +x "$SRV"
          echo "== 从装好的树起：$SRV =="
          # 只看"装载器解析完依赖并打印出用法"：llama.cpp 的 --help 走参数解析失败路径，
          # rc 可能是 0 也可能是 1（上游 main 返回 1），所以 0/1 都收；崩溃/缺库是别的码。
          set +e
          LD_LIBRARY_PATH="$(dirname "$SRV")" timeout 60 "$SRV" --help > /tmp/llama-help.txt 2>&1
          rc=$?
          set -e
          echo "llama-server --help rc=$rc"
          grep -q -- "--port" /tmp/llama-help.txt || { echo "--help 里没有 --port"; tail -30 /tmp/llama-help.txt; exit 1; }
          test "$rc" -eq 0 -o "$rc" -eq 1 || { echo "rc=$rc 不是 0/1（装载或启动失败）"; tail -30 /tmp/llama-help.txt; exit 1; }
          echo "::notice::交付清单 → 空数据根 → llama-server --help 成功（$(find "/tmp/installed-${OS_TAG}" -type f | wc -l) 个文件）"
      - name: 上传引擎负载与首启交付清单
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: engine-payload-${{ matrix.os_tag }}
          path: dist/${{ matrix.os_tag }}/
          retention-days: 14
