name: shell
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    # 外壳核心不依赖 Tauri，也不起引擎；三档 OS 各编一次就够证明它没有平台专属代码。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: shell/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: 工具链是镜像自带的
        run: |
          rustc --version
          cargo --version
      - name: 单测（契约驱动、无 Tauri、无引擎、无网络）
        run: cargo test --all-targets
      - name: 把首轮解析出的 Cargo.lock 留档（依赖图目前未钉，拿到后提交）
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: shell-core-Cargo.lock
          path: shell/core/Cargo.lock
          if-no-files-found: error

  app:
    # 外壳层真的要编 Tauri：Linux 缺 WebKitGTK 连 build script 都过不去，
    # Windows 的 tauri-build 会把 icons/icon.ico 嵌进资源段（缺了直接报错）。
    # 仍然不起窗口、不起引擎、不联网；三档只证明类型与 Tauri API 用法编得过。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: shell/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Linux 的 WebKitGTK 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 工具链是镜像自带的
        run: |
          rustc --version
          cargo --version
      - name: 单测（编 Tauri 用法与 8 条 IPC 命令，不跑窗口）
        run: cargo test --all-targets
      - name: 真起一次窗口（Xvfb，只到窗口出现，不起引擎、不联网）
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          NO_AT_BRIDGE: "1"
        run: |
          sudo apt-get install -y xvfb xdotool x11-utils
          cargo build --bin local-ai-studio-shell
          ls -l target/debug/local-ai-studio-shell
          xvfb-run -a -s "-screen 0 1024x768x24" bash -euo pipefail -c '
            ./target/debug/local-ai-studio-shell > /tmp/shell-boot.log 2>&1 &
            app=$!
            found=0
            for _ in $(seq 1 300); do
              if xdotool search --onlyvisible --pid "$app" >/dev/null 2>&1; then found=1; break; fi
              if xdotool search --onlyvisible --name "Local AI Studio" >/dev/null 2>&1; then found=1; break; fi
              if ! kill -0 "$app" 2>/dev/null; then break; fi
              sleep 0.1
            done
            if [ "$found" -ne 1 ]; then
              echo "没有等到窗口（app=$app，DISPLAY=$DISPLAY）；进程状态："
              ps -o pid,stat,etime,cmd -p "$app" || true
              echo "进程名下的窗口："
              xdotool search --pid "$app" getwindowname %@ 2>&1 | head -20 || true
              echo "窗口树："
              xwininfo -root -tree 2>&1 | head -40 || true
              echo "进程日志："
              cat /tmp/shell-boot.log || true
              kill "$app" 2>/dev/null || true
              wait "$app" 2>/dev/null || true
              exit 1
            fi
            sleep 2
            if ! kill -0 "$app" 2>/dev/null; then
              echo "窗口出现后进程退出；日志："
              cat /tmp/shell-boot.log || true
              exit 1
            fi
            win=$(xdotool search --onlyvisible --pid "$app" | head -1)
            echo "窗口标题：$(xdotool getwindowname "$win")"
            xdotool getwindowgeometry --shell "$win"
            kill "$app" 2>/dev/null || true
            wait "$app" 2>/dev/null || true
          '
      - name: 把首轮解析出的 Cargo.lock 留档（Tauri 依赖图目前未钉）
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: shell-app-Cargo.lock
          path: shell/src-tauri/Cargo.lock
          if-no-files-found: error
