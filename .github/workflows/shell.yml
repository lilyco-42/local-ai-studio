name: shell
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    # 外壳核心不依赖 Tauri，也不起引擎；三档 OS 各编一次就够证明它没有平台专属代码。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: shell/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: 工具链是镜像自带的
        run: |
          rustc --version
          cargo --version
      - name: 单测（契约驱动、无 Tauri、无引擎、无网络）
        run: cargo test --all-targets
      - name: 把首轮解析出的 Cargo.lock 留档（依赖图目前未钉，拿到后提交）
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: shell-core-Cargo.lock
          path: shell/core/Cargo.lock
          if-no-files-found: error
