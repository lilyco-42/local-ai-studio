name: 引擎连通性与无头推理实测
# 这条车道回答一个二值问题：在"本机不编译不运行"的前提下，
# 上游预编译产物 + sha256 pin 的模型，能不能在 CI 里真的跑出 token。
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/engine_probe.py"
      - "tools/ocr_catalog_check.py"
      - "tools/catalog_probe.py"
      - "tools/model_catalog_probe.py"
      - "tools/toolbelt_pins.py"
      - "tools/catalog_snapshot.py"
      - "tools/citation_check.py"
      - "tools/file_index.py"
      - "tools/recommend_models.py"
      - "tools/recommend_subtitle.py"
      - "catalog/subtitle-tiers.json"
      - "tests/fixtures/whisper_*"
      - "catalog/recommendations.json"
      - "tests/fixtures/recommend_slice.json"
      - "tools/payload_plan.py"
      - "tools/zip_peek.py"
      - "pins/payload-plan.json"
      - "catalog/defaults.json"
      - "tools/ocr_build_surface.py"
      - "pins/ocr-build-surface.json"
      - "pins/citations.json"
      - "catalog/describe.sha256"
      - "pins/toolbelt.json"
      # 判据抽成工具之后，改工具本身就得能触发对应用道（上一轮加 png_proof/srt_proof 时
      # 只加了步骤、没加这几行，那条 push 什么都不会跑 —— 这本身就是个假绿的形状）
      - "tools/png_proof.py"
      - "tools/srt_proof.py"
      - "tools/ocr_language_pins.py"
      - "tools/establish_pins.py"
      - "pins/ocr-languages.json"
      - "pins/models.json"
      - "pins/ocr.json"
      - "tests/fixtures/ocr_*"
      - ".github/workflows/engine-live.yml"

permissions:
  contents: read

jobs:
  discover:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      llama_url: ${{ steps.pick.outputs.llama_url }}
      llama_tag: ${{ steps.pick.outputs.llama_tag }}
      sd_url: ${{ steps.pick.outputs.sd_url }}
      sd_digest: ${{ steps.pick.outputs.sd_digest }}
      sd_size: ${{ steps.pick.outputs.sd_size }}
      sd_tag: ${{ steps.pick.outputs.sd_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 打真实 GitHub API 发现产物
        run: |
          python tools/engine_probe.py --live --require-gpu --json manifest.json
      - name: 挑选 linux 引擎
        id: pick
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open("manifest.json"))["targets"]
          llama = m["llama-ubuntu-base-x64"]
          sd = m["sd-ubuntu-base-x64"]
          print("llama_url=" + llama["url"])
          print("llama_tag=" + llama["release"])
          print("sd_url=" + sd["url"])
          print("sd_digest=" + sd["digest"].split(":", 1)[1])
          print("sd_size=" + str(sd["size"]))
          print("sd_tag=" + sd["release"])
          print("::notice::llama %s 产物 %s %.1fMB" % (llama["release"], llama["asset"], llama["size"] / 1048576))
          print("::notice::sd %s 产物 %s %.1fMB 上游digest=%s"
                % (sd["release"], sd["asset"], sd["size"] / 1048576, sd["digest"][:18]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: engine-manifest
          path: manifest.json

  os-inference-proof:
    # whisper 有几个产物连 OS 都不写（whisper-bin-x64.zip / whisper-blas-bin-x64.zip），
    # 发现器只能推断成 win。这里把"推断"换成"证据"：真下载、真解压、看里面是不是 PE 文件。
    # 必须遍历 manifest["inferred"]：上一版去解压 llama-win-cpu-x64，那名字里明写着 win，
    # 证实了一个从来不需要证实的东西，等于没测。
    needs: discover
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-manifest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成待证实清单
        run: |
          python - <<'PY' > inferred.tsv
          import json
          m = json.load(open("manifest.json"))
          for k in m["inferred"]:
              print("%s\t%s" % (k, m["targets"][k]["url"]))
          PY
          echo "待证实 $(wc -l < inferred.tsv) 个"
      - name: 逐个下载解压，要求产物里有 .exe/.dll
        run: |
          set -euo pipefail
          if [ ! -s inferred.tsv ]; then
            echo "::notice::本轮上游文件名都写明了 OS，推断车道无事可做"
            exit 0
          fi
          n=0
          while IFS="$(printf '\t')" read -r target url; do
            echo "=== $target"
            curl -sSL --fail -o /tmp/probe.zip "$url"
            unzip -l /tmp/probe.zip > /tmp/list.txt
            head -20 /tmp/list.txt
            grep -qE '\.(dll|exe)$' /tmp/list.txt \
              || { echo "推断为 win 的 $target 里没有 PE 文件，OS 推断规则错了"; exit 1; }
            n=$((n + 1))
            echo "::notice::$target 内含 PE 文件，win 推断成立"
          done < inferred.tsv
          test "$n" -gt 0 || { echo "清单非空却一个都没证实"; exit 1; }
          echo "已证实 $n 个靠推断的 win 产物"

  ocr-catalog:
    # OCR 权重只能按 URL 钉（release 没有官方 sha256）。上游挪 tag 或删产物时，
    # 这条要在 CI 先红，别等用户装到一半 404。
    # 故意不 needs discover：discover 一挂，上游会把它标成 skipped，OCR 的结论就看不见了。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 文档链接的权重是否都还在 release 里
        run: python3 tools/ocr_catalog_check.py --json ocr-catalog.json
      - name: 默认档的上游 digest 还是不是我们钉的那颗
        # 只查"URL 还在不在"是不够的：上游可以重打同名 tag，文件名不变而字节变了。
        # 那一刻车道里写死的 DET_SHA/REC_SHA/DICT_SHA 就是旧答案，必须在这里红。
        run: |
          python3 tools/ocr_catalog_check.py --pins-out fresh-ocr.json
          python3 - <<'PY'
          import json
          old = json.load(open("pins/ocr.json", encoding="utf-8"))
          new = json.load(open("fresh-ocr.json", encoding="utf-8"))
          drift = []
          for k, v in old.items():
              got = new.get(k)
              if not got:
                  drift.append("%s: 上游不再给这条默认档的 digest" % k)
                  continue
              for f in ("sha256", "size"):
                  if got[f] != v[f]:
                      drift.append("%s: %s 钉的是 %r，上游现在是 %r" % (k, f, v[f], got[f]))
          for k in new:
              if k not in old:
                  drift.append("%s: 上游多出一条同名默认档（要不要收进 pin 由人决定）" % k)
          print("OCR 默认档漂移 %d 条（对照 pins/ocr.json）" % len(drift))
          for d in drift:
              print("  !", d)
              print("::warning::" + d)
          raise SystemExit(1 if drift else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ocr-catalog
          path: ocr-catalog.json

  ocr-languages:
    # i18n 的 A 轴：14 种语言的 rec+dict 到底能不能"下载前就信"。
    # 这一步的结论是量出来的，不是概括来的：GitHub release 的 digest 与上游自己的
    # ModelScope 镜像 greatv/oar-ocr 的元数据 Sha256 **逐字符相等**的那些条目才是 4.5 级；
    # 只有一家给哈希的落回 3 级；繁中/日文/格鲁吉亚三个 v3 字典两家都没有，只能按 commit 自算。
    # 三步各自查不同的事，缺一步就有一类漂移没人管：
    #   ① --check --fixtures：仓库里已提交的 pin 与已提交的快照对不对得上（抓"手抄改过一个字段"）；
    #   ② --check --live：上游四张表现在还认不认这些 pin（抓 release 被重打 / ModelScope 换文件）；
    #   ③ 重新 --live 立一张，逐字段与提交的那张比（抓"整体结构或体积聚合漂了"）。
    # ③ 有意忽略 pinned_commit / resolved_url 两个字段：PaddleOCR 的 main 一直在动，
    #   那两条每次跑都不同，而它们**不是**结论；字典内容本身（sha256）照样要相等。
    # 故意不 needs discover：discover 一挂会把这条标成 skipped，语言包的结论就看不见了
    #（与 ocr-catalog 同一个理由）。
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 与仓库快照自洽（离线，上游今天心情不好也照样能红）
        run: python3 tools/ocr_language_pins.py --check --fixtures
      - name: 默认档那张 pin 的两家元数据也必须一致
        # pins/ocr.json 那三条的 meta_hashes 是这张工具补进去的（4.5 级）。
        # 上游哪天重发一次文件，这里会先于出包车道红 —— 而不是等到用户装到一半才发现哈希对不上。
        run: python3 tools/ocr_language_pins.py --check-pins pins/ocr.json --live
      - name: 与上游四张表逐条复核（真漂移）
        run: python3 tools/ocr_language_pins.py --check --live
      - name: 重新立一张表，要求与已提交的那张逐字段相等
        run: |
          python3 tools/ocr_language_pins.py --live --pins-out fresh-ocr-languages.json
          python3 - <<'PY'
          import json

          VOLATILE = {"pinned_commit", "resolved_url"}


          def strip(x):
              if isinstance(x, dict):
                  return {k: strip(v) for k, v in x.items() if k not in VOLATILE}
              if isinstance(x, list):
                  return [strip(i) for i in x]
              return x


          def leaves(x, path=""):
              out = {}
              if isinstance(x, dict):
                  for k, v in x.items():
                      out.update(leaves(v, path + "." + str(k)))
              elif isinstance(x, list):
                  for i, v in enumerate(x):
                      out.update(leaves(v, path + "[" + str(i) + "]"))
              else:
                  out[path] = x
              return out


          old = strip(json.load(open("pins/ocr-languages.json", encoding="utf-8")))
          new = strip(json.load(open("fresh-ocr-languages.json", encoding="utf-8")))
          a, b = leaves(old), leaves(new)
          drift = []
          for k in sorted(set(a) | set(b)):
              if k not in b:
                  drift.append(k + ": 已提交有、上游现在没有（" + repr(a[k]) + "）")
              elif k not in a:
                  drift.append(k + ": 上游多出来（" + repr(b[k]) + "）")
              elif a[k] != b[k]:
                  drift.append(k + ": " + repr(a[k]) + " → " + repr(b[k]))
          print(f"逐字段比对 {len(a)} 个叶子值，漂移 {len(drift)} 条")
          for d in drift[:40]:
              print("  !", d)
          if drift:
              print("::error::上游四张表与仓库里这张 pin 已经不一致，要么显式重立，要么说明为什么不动")
          raise SystemExit(1 if drift else 0)
          PY
      - name: 正向对照：这张表必须是"两家给同一个哈希"为主，而不是全 3 级
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("pins/ocr-languages.json", encoding="utf-8"))
          lv = p["level_counts"]
          print("层级分布 =", lv, "语言数 =", p["languages"])
          # 聚合值不许是手抄的：这里重新逐条相加一次
          per = sum(e["rec"]["size"] + (e["dict"].get("size") or 0)
                    for e in p["entries"].values())
          if per != p["rec_dict_bytes"]:
              raise SystemExit(f"聚合值与逐条相加不符（表里 {p['rec_dict_bytes']}，逐条 {per}）")
          if lv.get("4.5", 0) < 20:
              raise SystemExit(f"两家一致（4.5 级）的条目掉到 {lv.get('4.5', 0)} 条 —— "
                               f"上游 ModelScope 镜像大概不再同步了，语言包不能按这张表发货")
          if p["languages"] != 14:
              raise SystemExit(f"语言数从 14 变成 {p['languages']}，i18n 那篇文档要重写")
          print("通过：14 种语言，4.5 级", lv.get("4.5", 0), "条，聚合值可复算")
          PY

  catalog-probe:
    # 验的是"目录搜索的 API 形状和三条判据还成立"（泛词有结果 / 精确仓库能搜到 / 乱词必须 0 条），
    # 跑在 GitHub runner 侧 → 它**不代表国内可达性**。国内能不能连 hf-mirror、R2 有多快，
    # 由人工从 lain42.top 复测（docs/adr/0001 里那组数字就是这么来的），别拿这条车道当那件事的证据。
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 目录搜索探针
        run: python3 tools/catalog_probe.py --json catalog-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-probe
          path: catalog-probe.json

  model-catalog:
    # 目录侧的漂移闸门：仓库还在不在、大小对不对、上游给不给内容哈希。
    # 最后一条是结论性的：HF 的 ETag 长得像 sha256 但不是，谁拿它当校验值谁就静默错位，
    # 所以这条车道要在"ETag 忽然等于 sha256"或者"元数据开始给哈希"时告诉我们规则可以放宽。
    # 它不 needs discover：上游一挂就会被标 skipped，结论看不见。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 权重目录与哈希可得性探针
        run: python3 tools/model_catalog_probe.py
      - name: 第二家哈希：把 HF 的 tree.lfs.oid 与已钉的 pin 对表
        # 2026-10-20 更正带来的新判据：`lfs.oid` 是另一家分发方独立给的内容 sha256，
        # 所以"两家都说同一个哈希"零下载就能成立。它**不是**真字节，级别名里写清了"仍不是真字节"，
        # 也不许写进 bytes_verified。上一版探针读错键名（读 oidsha/sha）得出"HF 不给哈希"，
        # 于是这句假结论进了五处文档 —— 这条同时也是那个盲点的守卫。
        run: python3 tools/establish_pins.py --cross-hf pins/models.json
      - uses: actions/upload-artifact@v4
        with:
          name: model-catalog
          path: model-catalog.json

  catalog-snapshot:
    # 描述层快照是"按 commit + sha256 钉住的上游文件"（llmfit 的 hf_models.json）。
    # 这条盯的是上游有没有漂：漂了就必须显式重钉，因为那张表 91% 的 `_revalidated` 是空的，
    # 它自己都不保证复核过 —— 我们更不能拿"它变了"当成"它对了"。
    # 它不 needs discover：discover 一挂就会被标 skipped，结论看不见。
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取上游快照 → 校验钉住的哈希 → 核对侧表（快照可复现）
        # --live --check 现在做两件事：上游整文件的 sha256 要等于 UPSTREAM["sha256"]，
        # 以及 slim() 重导出的那 5.5 MB 要等于 catalog/describe.sha256 记的哈希与体积。
        # 后者是 2026-10-20 补的：describe.json 本身 .gitignore（可复现的派生物），
        # 所以"出厂目录长什么样"在仓库里只剩这颗哈希 —— 没有它，slim() 少抄一个字段也没人知道。
        run: python3 tools/catalog_snapshot.py --live --check
      - name: 默认档的强度级必须是推导出来的，不是手写在表上的
        # catalog/defaults.json 是外壳 UI 唯一的"这条 pin 有多可信"来源。
        # 有人（包括我）在表上手改一个 5，或加了条 pin 忘了进表，都没人会红 —— 这一步就是为了让它红。
        run: python3 tools/catalog_snapshot.py --defaults-check

  toolbelt-pins:
    # 工具带（llmfit / llama-swap / gguf-parser）按 ADR-0001 同一条规矩钉死：具体 release + sha256。
    # 这条答的是"上游有没有漂"：产物改名、少发一个平台、digest 消失、sidecar 与 API digest 对不上，
    # 全都要在 CI 先红 —— 别等外壳装到一半才发现 404 或校验不上。
    # 它不 needs discover：discover 一挂就会被标 skipped，结论看不见。
    # pins/toolbelt.json 由 `python tools/toolbelt_pins.py --live --json pins/toolbelt.json` 立，
    # 重立之前必须知道：只有 API digest 一套机制的那 4 条（gguf-parser）强度低于另外 8 条。
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 实时取上游产物表，与钉表逐字段比对
        run: python3 tools/toolbelt_pins.py --live --check pins/toolbelt.json
      - name: 从钉表取 linux x64 的 llmfit
        id: pick
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("pins/toolbelt.json"))["llmfit/x86_64-unknown-linux-gnu"]
          print("url=" + p["url"])
          print("sha256=" + p["sha256"])
          print("size=" + str(p["size"]))
          PY
      - name: 按钉下载，再实测文档里那面 --json 旗标还在不在
        # 钉住哈希只证明"取到的字节没变"，不证明"我们记的用法还成立"。
        # 所以这里真跑一次：help 里必须还有 --json，且 recommend --json 的 stdout 必须能解析成 JSON。
        # rc 不作要求 —— runner 上一个模型都没有，"查无结果"不是我们的车道该红的东西。
        run: |
          set -euo pipefail
          curl -sSL --fail --max-time 300 -o llmfit.tar.gz "${{ steps.pick.outputs.url }}"
          test "$(stat -c %s llmfit.tar.gz)" = "${{ steps.pick.outputs.size }}" \
            || { echo "体积与钉表不符"; exit 1; }
          echo "${{ steps.pick.outputs.sha256 }}  llmfit.tar.gz" | sha256sum -c -
          tar xzf llmfit.tar.gz
          BIN="$(find . -maxdepth 2 -type f -name llmfit | head -1)"
          test -n "$BIN" || { echo "解压后 depth 1-2 没找到 llmfit，条目表："; tar tzf llmfit.tar.gz | head -30; exit 1; }
          "$BIN" --help > help.txt 2>&1 < /dev/null || true
          grep -q -- "--json" help.txt \
            || { echo "钉住的这版 help 里没有 --json：docs/toolbelt.md 记的用法已过期"; head -40 help.txt; exit 1; }
          set +e; "$BIN" recommend --json > rec.json 2> rec.err; rc=$?; set -e
          echo "::notice::recommend --json 退出码 $rc（runner 上无模型，非 0 不作为判据）"
          python3 - <<'PY'
          import json
          raw = open("rec.json", encoding="utf-8", errors="replace").read()
          try:
              d = json.loads(raw)
          except Exception as e:
              print("stdout 不是 JSON：", e)
              print("stdout 前 300：", raw[:300])
              print("stderr 前 500：", open("rec.err", encoding="utf-8", errors="replace").read()[:500])
              raise SystemExit(1)
          keys = list(d)[:8] if isinstance(d, dict) else ["<list>", len(d)]
          print("recommend --json 顶层类型 =", type(d).__name__, "字节数 =", len(raw), "键 =", keys)
          PY

  subtitle-proof:
    # 四项能力原先只有对话一条真跑过（还没跑成）。这条把字幕这一路补上：
    # 引擎来自 whisper.cpp 的 ubuntu 产物、权重来自 HF、样本来自仓库自带的 jfk.wav，
    # 三个输入的 sha256 全部预先钉好（引擎那层来自上游 digest，HF 那两层由 tools/establish_pins.py
    # 跨主机对照立起来），跑出来必须是一份带时间戳、内容对得上的 SRT。
    needs: discover
    # 20 → 30：同一步里多起了一次常驻 whisper-server（权重重加载 + 最长 2 分钟就绪轮询 + 一次转写）。
    # 这两个数都还是估的，第一次真跑要按实际耗时改回来。
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ENGINE_URL: https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-bin-ubuntu-x64.tar.gz
      ENGINE_SHA256: a72becf15d7917f990f6313867a52638b82b7f9ef237fb0c980dac56a135781c
      ENGINE_SIZE: "10364195"
      MODEL_FILE: ggml-tiny.bin
      MODEL_SIZE: "77691713"
      MODEL_SHA256: be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
      SAMPLE_URL: https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
      SAMPLE_SIZE: "352078"
      SAMPLE_SHA256: 59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e
    steps:
      - uses: actions/checkout@v4
        # 常驻服务那一步要调 tools/srt_proof.py，判据抽成了工具就得让仓库在场。
      - name: 下载引擎并校上游 digest
        run: |
          curl -sSL --fail --max-time 300 -o engine.tar.gz "$ENGINE_URL"
          test "$(stat -c %s engine.tar.gz)" = "$ENGINE_SIZE" || { echo "引擎体积不符"; exit 1; }
          echo "$ENGINE_SHA256  engine.tar.gz" | sha256sum -c -
      - name: 下载权重（HF 直连与镜像互为备选）
        run: |
          ok=""
          for u in "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$MODEL_FILE" \
                   "https://hf-mirror.com/ggerganov/whisper.cpp/resolve/main/$MODEL_FILE"; do
            echo "试 $u"
            if curl -sSL --fail --max-time 900 -o model.bin "$u"; then ok=yes; break; fi
          done
          test -n "$ok" || { echo "两个源都拿不到 $MODEL_FILE"; exit 1; }
          test "$(stat -c %s model.bin)" = "$MODEL_SIZE" || { echo "权重体积不符"; exit 1; }
          echo "$MODEL_SHA256  model.bin" | sha256sum -c -
      - name: 下载样本并校验
        run: |
          curl -sSL --fail --max-time 120 -o jfk.wav "$SAMPLE_URL"
          test "$(stat -c %s jfk.wav)" = "$SAMPLE_SIZE" || { echo "样本体积不符"; exit 1; }
          echo "$SAMPLE_SHA256  jfk.wav" | sha256sum -c -
      - name: 定位二进制并跑出一条 SRT
        run: |
          mkdir -p w && tar -xzf engine.tar.gz -C w
          echo "=== 解出来的目录（实测是 whisper-bin-ubuntu-x64/ 这一层，不是平铺）==="
          find w -maxdepth 2 | head -20
          BIN=$(find w -type f -name whisper-cli | head -1)
          test -n "$BIN" || { echo "包里没有 whisper-cli，需要改选择逻辑（包内另有 main，别当它）"; exit 1; }
          # 包里的动态库就在同一目录（libwhisper.so、libggml.so.0.26.0 等），不假设 rpath
          export LD_LIBRARY_PATH="$(dirname "$BIN"):$LD_LIBRARY_PATH"
          chmod +x "$BIN"
          ldd "$BIN" | grep -i "not found" && { echo "动态库缺失"; exit 1; } || echo "动态库齐全"
          echo "=== 同目录里的兄弟产物 ==="
          ls "$(dirname "$BIN")" | head -12
          #  flags 逐个在 examples/cli/cli.cpp 里查到：-f/--file、-t/--threads、-osrt/--output-srt、
          #  -l/--language、-of/--output-file。不写 -of 时输出名是从**输入名**推的
          #  （源码：fname_out = fname_out_.empty() ? fname_inp : fname_out_），
          #  所以这里显式指定，别靠默认行为猜文件名。
          #  ggml-tiny.bin 是多语版本，所以 -l en 显式给，不留给自动检测去赌时间。
          #  `-of` 给的是**基名**，不是完整文件名：b5454 的 fout_factory
          #  （examples/cli/cli.cpp:1165-1166）是把扩展名直接拼在给定名字后面，
          #  写 `-of jfk.srt` 得到的是 `jfk.srt.srt`，而原来的判据会去 ls jfk.srt —— 必红且原因很怪。
          #  产出名仍靠 glob 找：上游哪天换扩展名，红字要说"命名变了"，不是"没产出字幕"。
          timeout 600 "$BIN" -m model.bin -f jfk.wav -l en -t 2 -osrt -of jfk > run.log 2>&1 || { tail -30 run.log; exit 1; }
          echo "=== 产出文件 ==="; ls -l
          SRT=$(ls -1 jfk*.srt 2>/dev/null | head -1)
          test -n "$SRT" || { echo "没找到 jfk*.srt —— 上游改了输出命名或扩展名"; tail -30 run.log; exit 1; }
          echo "实际产出的字幕文件：$SRT"
          cat "$SRT"
          grep -q -- '-->' "$SRT" || { echo "SRT 里没有时间戳行"; exit 1; }
          # 已知答案对照：这段是肯尼迪名句，至少要落进一个关键词；tiny 模型措辞不稳，不逐字比
          tr 'A-Z' 'a-z' < "$SRT" | grep -qE 'country|ask not' || { echo "转写内容与已知样本对不上"; exit 1; }
          N=$(grep -c -- '-->' "$SRT")
          echo "::notice::字幕车道通过：$SRT 有 $N 条带时间戳的段，引擎与权重均按上游 sha256 校验"
      - name: 起常驻 whisper-server，用 HTTP 再转一次同一段音频
        # ADR 的实现约束第 1 条是"外壳起常驻服务，而不是每个任务起一次进程"。上面那条只是 one-shot CLI，
        # 这条路（服务常驻 + multipart 上传 + 服务端渲染 SRT）一步都没跑过，所以它的"能出字幕"不能算作证过。
        # 契约逐个在 b5454 源码里核过，不是照 README 猜的：
        #   默认 127.0.0.1:8080（examples/server/server.cpp:59/65）、推理路径 /inference（:62）、路由注册 :826
        #   GET /health 在加载期回 **503** + {"status":"loading model"}（:1218-1225），就绪才是 {"status":"ok"}
        #   音频字段必须叫 file（:831），其余参数全部走 multipart 字段（:482-622 清一色 has_file）
        #   response_format=srt 时正文以 application/x-subrip 回吐（:1023-1041）
        # 二进制名 whisper-server 不是推测：2026-10-20 把上游 ubuntu 包整包（sha256 与 pin 相等）
        # 列过条目，它就在 whisper-bin-ubuntu-x64/ 深度 1，与 whisper-cli 同目录。
        run: |
          set -euo pipefail
          SRV=$(find w -type f -name whisper-server | head -1)
          test -n "$SRV" || { echo "包里没找到 whisper-server，实际条目："; find w -maxdepth 2 -type f | head -40; exit 1; }
          chmod +x "$SRV"
          # 与 CLI 是两个文件，动态库在同一目录，所以这里自己带 LD_LIBRARY_PATH。
          # 用 ${LD_LIBRARY_PATH:+…} 而不是 :$LD_LIBRARY_PATH：runner 上这个变量本来就没设，
          # set -u 会直接把这一步吹掉（2026-10-19 在 llama-server 那一步就踩过一次）。
          export LD_LIBRARY_PATH="$(dirname "$SRV")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$SRV" | grep -i "not found" && { echo "whisper-server 动态库缺失"; exit 1; } || echo "动态库齐全"
          "$SRV" -m model.bin --host 127.0.0.1 --port 9009 -t 2 > srv.log 2>&1 &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 60); do
            # curl -f 让 503（还在加载）自然失败并继续轮询；再要求正文含 "ok"，
            # 免得哪天上游把就绪态也写成 {"status":"loading model"} 却回 200。
            if curl -fsS --max-time 5 http://127.0.0.1:9009/health 2>/dev/null | grep -q '"ok"'; then
              ready=yes; break
            fi
            sleep 2
          done
          test -n "$ready" || { echo "whisper-server 60 次探测（约 2 分钟）内没到就绪态"; tail -40 srv.log; exit 1; }
          echo "::notice::whisper-server 第 $i 次探测就绪"
          CODE=$(curl -sS -D srv.hdr -o srv.srt -w '%{http_code}' --max-time 300 \
                 -F file=@jfk.wav -F response_format=srt -F language=en \
                 http://127.0.0.1:9009/inference)
          echo "POST /inference 返回 HTTP $CODE"
          test "$CODE" = 200 || { echo "不是 200；响应体前 300 字节："; head -c 300 srv.srt; tail -30 srv.log; exit 1; }
          CT=$(grep -i '^content-type:' srv.hdr | tr -d '\r' | cut -d' ' -f2- || true)
          # 判据不在这里内联，走 tools/srt_proof.py：编号连续、时间戳单调、每块有正文、
          # 已知答案命中、Content-Type 是 subrip —— 每条都有离线对照单测（CI 现在跑不起来，
          # 只能靠"好样本必须过、坏样本必须红在对应那一句"来证明判据本身不是摆设）。
          python3 tools/srt_proof.py --file srv.srt --min-blocks 4 \
            --expect-any 'country|ask not' --content-type "$CT"
          echo "::notice::字幕这条常驻服务路也通了（POST /inference → application/x-subrip）"

  payload-plan:
    # 出包前的最后一个空白：每个 OS 默认档到底取哪个产物、包里收哪些文件、下多少占多少。
    # 这里只做 Range 读中央目录（不解压、不下整包、不运行任何东西），
    # 三条判据都是"清单看着对但其实没用"的那类：主二进制被滤掉、排除规则从没命中过、
    # win 的 x-impl.dll 成了孤儿。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 离线：产物级选择与大小（选错产物就是打错包）
        run: python3 tools/payload_plan.py
      - name: 逐文件：Range 读 zip 中央目录（tar.gz 如实标 needs_extract）
        run: python3 tools/payload_plan.py --live

  file-index:
    # 下载层的形状判据：两家分发方的元数据哈希**一致**才允许"下载前就信"；
    # 只有一家 → single（必须下载后自算），两家不等 → conflict 且一个答案都不给。
    # 正向对照 = 仓库里已钉的 pin；负向对照 = 一根故意造的假文件名 ——
    # 它要也被判成"有哈希"，就说明这套比对对任何输入都有答案。
    # 不 needs discover：被挂住的 job 会被标 skipped，结论看不见。
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 离线对照（五种状态 + 候选顺序，明知错的必须认成错）
        run: python3 tools/file_index.py --selfcheck
      - name: 按已钉的 pin 做正向与负向对照（覆盖度地板 2 条）
        run: python3 tools/file_index.py --control pins/models.json

  recommendations:
    # 面向用户的那张"我这台机器该装哪个"表。出厂默认档（catalog/defaults.json）是车道最小样本，
    # 不是推荐；这张表才是 UI 对话档的来源，所以四条选择规则都得可复核：
    # 半档<recommended_ram_gb<=档位、档内按上游下载量、仓库依次试 ggml-org→unsloth→mradermacher、
    # 文件要整只（排除 -of- 分片与 dflash/mmproj 这类附带产物）且大小<档位×1 GiB。
    # 离线那两步是本车道的主角（runner 有没有网都能红）；真联网那步只负责发现上游漂移。
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 判据本身（全部离线：含用真元数据切片重算已提交那张表）
        run: python -m unittest tests.test_recommend_models -v
      - name: 用切片离线重算并与已提交的那张比漂移（不联网，改一个字也要红）
        run: python3 tools/recommend_models.py --fixtures tests/fixtures/recommend_slice.json --check
      - name: 真取两家元数据重算（上游漂了就红，包括某档凑不满）
        run: python3 tools/recommend_models.py --live --check

  subtitle-tiers:
    # 字幕这一档不能沿用对话那套：llmfit 的目录里 ASR 只有 5 条（OCR/生图 0 条，已实测），
    # 所以"这台机器跑哪颗 whisper 模型"只能用 whisper.cpp 自己写的数字。
    # 四张上游表互相咬：README 的 Memory usage、models/README 的 Model|Disk|SHA 与三条语义规则、
    # download-ggml-model.sh 的白名单与下载源、宿主仓库的文件表（两家各一份）。
    # 前两步不联网也要红 —— 车道至今 0 次执行，能离线证明的判据才真的算判据。
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 判据本身（离线，含明知是错的必须认成错）
        run: python3 tools/recommend_subtitle.py --selftest
      - name: 判据单测（含与已钉 whisper pin 的跨产物一致性、语言表的静默少项回归）
        run: python -m unittest tests.test_recommend_subtitle -v
      - name: 用真捕获离线重算并与已提交那张比漂移
        run: python3 tools/recommend_subtitle.py --fixtures tests/fixtures --check
      - name: 真取四张表重算（上游改表、撤文件、档位凑不满都要红）
        run: python3 tools/recommend_subtitle.py --live --check

  ocr-build-surface:
    # 四项能力里只有 OCR 要现场编译，而"钉 commit"对它**并不等于钉住构建输入**：
    # 上游 .gitignore 明写 `Cargo.lock`，实测那颗 commit 里也没有（raw 回 404，正向对照 Cargo.toml 206），
    # 而 40 个外部包里只有 ort 是 `=` 精确钉的，其余 37 个都是 caret —— cargo 会在构建时重新解析。
    # 这条车道盯两件会悄悄变的事：① 依赖声明的钉法分布（fingerprint 漂了就红，并点名谁变了）；
    # ② 上游哪天开始发 Cargo.lock（那意味着车道该改成取它的锁，而不是自己解析）。
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 先跑离线对照（分类器与比对函数自己得是对的）
        run: python -m unittest tests.test_ocr_build_surface -v
      - name: 按 pin 住的 commit 量一遍依赖面并与已提交记录比对
        run: python3 tools/ocr_build_surface.py --check

  ocr-proof:
    # OCR 是四项能力里唯一没有上游二进制的，所以这条车道要在 CI 里 cargo build（CI 编译是允许的，
    # 本机禁止）。所有输入都可钉：源码用 git 提交号（git 本身内容寻址），
    # 三个模型/字典用 release 的 digest（实测每个产物都有），测试图由车道自己画——
    # 自己生成的东西不需要 pin，pin 只在"从别人那儿拿"时才需要。
    # 每个名字都查到过出处：包叫 oar-ocr-cli、二进制叫 oar（Cargo.toml 的 [[bin]]），
    # 自定义模型必须 --det/--rec/--dict 三个一起给（其 README 明说不能与 --size 混用）。
    timeout-minutes: 34
    runs-on: ubuntu-latest
    env:
      # 钉 commit 而不是 tag：2026-10-19 实测 **v0.10.0 那个 tag 里没有 oar-ocr-cli**
      # （根 Cargo.toml 的 members 只有 ". / oar-ocr-derive / oar-ocr-core / oar-ocr-vl"），
      # CLI 是发版之后才并进 main 的 —— 该 commit 比 v0.10.0 领先 24 个提交。
      # 按 tag 钉的话这条车道会在"取源码"那步就红，而且是红得没道理。
      SRC_REF: 84817f58d7a0932d5368a9fa18105ba5d842af29   # main，feat(vl): add native Youtu-Parsing-Omni support (#227)
      DET_SHA: 193bab7a04fca699a6c82e6abb5b81bdb28177f0abd4062552b04908dafb19f8
      REC_SHA: 9ef676d6ed3c88256a2d92c640c44f25b0c40947e111b14b8be8f594091563e6
      DICT_SHA: c5cbe34ef40c29c4df07ed012bf96569cb69a2d2a01a07027e9f13cb832bd9cd
      DET_SIZE: "1780590"
      REC_SIZE: "4462639"
      DICT_SIZE: "27156"
      WORD: OARCI2291
    steps:
      - name: 确认工具链够新（workspace 要 edition 2024 / rust-version 1.95）
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          python3 - <<'PY'
          import re, subprocess, sys
          v = subprocess.run(["rustc", "--version"], capture_output=True, text=True).stdout
          m = re.search(r"(\d+)\.(\d+)", v)
          major, minor = int(m.group(1)), int(m.group(2))
          print(f"::notice::rustc {major}.{minor}，workspace 要求 ≥1.95")
          if (major, minor) < (1, 95):
              sys.exit(f"工具链 {major}.{minor} 低于 oar-ocr workspace 声明的 1.95，"
                       "换 toolchain 而不是降低要求")
          PY
      - name: 按提交号取源码
        run: |
          git init -q src
          cd src
          git remote add origin https://github.com/GreatV/oar-ocr.git
          git fetch -q --depth 1 origin "$SRC_REF"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SRC_REF" \
            || { echo "检出的不是钉住的那颗 commit"; exit 1; }
          # 这两条断言是 2026-10-19 加上的：上一版拿 tag 去 clone，而那个 tag 里根本没有 CLI；
          # 又拿 `name = "oar-ocr-cli"` 去 grep 根 Cargo.toml —— 成员表写的是裸名字，
          # `name = ` 只在 CLI 自己的 Cargo.toml 里，两条都会红在错的地方。
          grep -q '"oar-ocr-cli"' Cargo.toml \
            || { echo "workspace 成员表里没有 oar-ocr-cli（这就是 v0.10.0 那个 tag 的情况）"; exit 1; }
          grep -q 'name = "oar"' oar-ocr-cli/Cargo.toml \
            || { echo "CLI 的 [[bin]] 名字不是 oar，产物路径要改"; exit 1; }
          grep -q 'edition = "2024"' Cargo.toml || { echo "workspace edition 变了，工具链要求要重量"; exit 1; }
      - name: 编译 CLI（CI 编译，本机禁止）
        working-directory: src
        # 2026-10-20 实测：上游 .gitignore 明写 `Cargo.lock`，钉住的那颗 commit 里也没有
        # （raw 回 404，正向对照 Cargo.toml 回 206）。`tools/ocr_build_surface.py` 量到
        # 40 个外部包里只有 ort 是 `=` 精确钉的，其余 37 个是 caret —— 所以**钉 commit 不等于钉构建输入**，
        # cargo 会在构建时重新解析依赖图。这一项是四项能力里唯一的例外，别的都能靠 release+sha256 钉死。
        # 处置：锁由我们自己出。第一次真跑在这里 `cargo generate-lockfile` 并把 Cargo.lock 传成 artifact，
        # 人把它提交成 `pins/ocr-Cargo.lock`；此后这一步改走 `--locked`，缺锁或漂了都红。
        run: |
          set -euo pipefail
          LOCKED=""
          if [ -f ../pins/ocr-Cargo.lock ]; then
            cp ../pins/ocr-Cargo.lock Cargo.lock
            LOCKED="--locked"
            echo "::notice::依赖图按仓库里的 pins/ocr-Cargo.lock 钉住（cargo 走 --locked）"
          else
            cargo generate-lockfile
            echo "::warning::上游不发 Cargo.lock 而仓库里也还没有 pins/ocr-Cargo.lock —— 这次的依赖图是现场解析的，不能算钉住"
          fi
          test -s Cargo.lock || { echo "没有 Cargo.lock，锁形状断言无从谈起"; exit 1; }
          sha256sum Cargo.lock | tee "$RUNNER_TEMP/ocr-Cargo.lock.sha256"
          python3 - <<'PY'
          import re


          def fail(msg):
              raise SystemExit(f"依赖锁不合格：{msg}")


          text = open("Cargo.lock", encoding="utf-8", errors="replace").read()
          pkgs = re.findall(r'(?m)^\[\[package\]\]$', text)
          pairs = dict()
          for blk in text.split("[[package]]")[1:]:
              n = re.search(r'name = "([^"]+)"', blk)
              v = re.search(r'version = "([^"]+)"', blk)
              if n and v:
                  pairs[n.group(1)] = v.group(1)
          print(f"lock 里 {len(pkgs)} 个包；{len(pairs)} 个有名有版本")
          if len(pkgs) < 50:
              fail(f"只有 {len(pkgs)} 个包，不像一份完整的依赖锁（oar-ocr 的图不可能这么小）")
          # ort 是 ADR 里唯一被上游写成 =精确 的那个，也是最容易在解析时漂掉的一个
          if pairs.get("ort") != "2.0.0-rc.13":
              fail(f"ort 在锁里是 {pairs.get('ort')!r}，而 workspace 声明的是 =2.0.0-rc.13")
          for must in ("onig_sys", "tokenizers"):
              if must not in pairs:
                  fail(f"锁里没有 {must} —— 与 ADR 记的 C 工具链代价不符，要重量一遍")
          print("锁的形状认得：", {k: pairs[k] for k in sorted(pairs)[:6]})
          PY
          cargo build $LOCKED --release -p oar-ocr-cli
          BIN=target/release/oar
          test -x "$BIN" || { echo "编出来的不是 target/release/oar，看下面："; ls -l target/release | head -20; exit 1; }
          "$BIN" --help > "$RUNNER_TEMP/help.txt" 2>&1 < /dev/null || true
          head -25 "$RUNNER_TEMP/help.txt"
      - name: 把这份依赖锁传回来（第一次真跑后由人提交成 pins/ocr-Cargo.lock）
        uses: actions/upload-artifact@v4
        with:
          name: oar-cargo-lock
          path: |
            src/Cargo.lock
            ${{ runner.temp }}/ocr-Cargo.lock.sha256
          if-none-available: false
      - name: 取三个模型文件并按上游 digest 校验
        # 模型/字典来自 release **v0.7.0**，与上面源码的 commit 不同源是有意为之：
        # 这三条 tiny 文件只在 v0.7.0 那批产物里（2026-10-19 逐条下整包验过：
        # 1,780,590 / 4,462,639 / 27,156 B，实算 sha256 与 pins/ocr.json 相等）。
        run: |
          base=https://github.com/greatv/oar-ocr/releases/download/v0.7.0
          curl -sSL --fail --max-time 300 -o det.onnx  "$base/pp-ocrv6_tiny_det.onnx"
          curl -sSL --fail --max-time 300 -o rec.onnx  "$base/pp-ocrv6_tiny_rec.onnx"
          curl -sSL --fail --max-time 300 -o dict.txt  "$base/ppocrv6_tiny_dict.txt"
          test "$(stat -c %s det.onnx)" = "$DET_SIZE" || { echo "det 体积不符"; exit 1; }
          test "$(stat -c %s rec.onnx)" = "$REC_SIZE" || { echo "rec 体积不符"; exit 1; }
          test "$(stat -c %s dict.txt)" = "$DICT_SIZE" || { echo "dict 体积不符"; exit 1; }
          echo "$DET_SHA  det.onnx" | sha256sum -c -
          echo "$REC_SHA  rec.onnx" | sha256sum -c -
          echo "$DICT_SHA  dict.txt" | sha256sum -c -
      - name: 画一张已知答案的图
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont
          word = os.environ["WORD"]
          img = Image.new("RGB", (900, 220), "white")
          d = ImageDraw.Draw(img)
          # 字体用 runner 自带的 DejaVu；找不到就退回 Pillow 内置点阵字（会糊，但车道会如实红）
          cands = ["/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                   "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
          p = next((c for c in cands if os.path.exists(c)), None)
          if p is None:
              print("::warning::没找到 DejaVu，用默认字体，识别率会掉——这条车道要的是链路通，不是指标")
              d.text((40, 80), word, fill="black")
          else:
              d.text((40, 60), word, fill="black", font=ImageFont.truetype(p, 96))
          img.save("page.png")
          print("page.png 字节数 =", os.path.getsize("page.png"))
          PY
      - name: 跑 OCR，要求认得出那个词
        run: |
          src/target/release/oar ocr --det det.onnx --rec rec.onnx --dict dict.txt page.png > out.txt 2> err.txt \
            || { echo "oar 非零退出："; tail -25 err.txt; exit 1; }
          echo "=== stderr 尾部 ==="; tail -8 err.txt
          echo "=== stdout ==="; cat out.txt
          # 归一化后比子串：不假设模型输出的空格/换行/置信度排版
          python3 - <<'PY'
          import os, re
          got = re.sub(r"[^A-Z0-9]", "", open("out.txt", encoding="utf-8", errors="replace").read().upper())
          want = os.environ["WORD"]
          print(f"归一化后 {len(got)} 个字符，找 {want}：{'命中' if want in got else '没命中'}")
          if want not in got:
              raise SystemExit(
                  "已知答案的词没认出来。这**不是链路坏了**（前面全部校验都过了），"
                  f"而是 tiny 档在这张合成图上的质量低于底线：实际输出={got[:120]!r}")
          PY
          echo "::notice::OCR 车道通过：tiny 档从自建图认出了 $WORD"

  image-proof:
    # 第四项能力（生图）。分工是刻意的：**引擎走 discover 实时发现的产物**（上游每天出 nightly，
    # 钉死引擎就等于天天红，而且测的还是旧版），**权重钉死**（1,494.2 MiB，
    # pin 由 ModelScope 元数据 Sha256 + 其 CDN 内容寻址路径 + 跨源总长三条一致立起来，零下载）。
    # 旗标全部在 examples/common/common.cpp 与 examples/cli/main.cpp 的选项表里查到过：
    #   -m/--model、--diffusion-model、--width/--height（默认 512）、--steps（默认 20）、
    #   --cfg-scale、--sampling-method、-o/--output。仍按对话那条路的做法：先看 -h 再决定用哪个。
    # 强判据：产物 PNG 自己得带着参数。上游把参数写进 PNG 的 tEXt 块（keyword="parameters"），
    # 不是打到日志里 —— 2026-10-19 读源码确认：common.cpp:3239/3269 拼 "Steps: N" 与 "Size: WxH"，
    # 但 get_image_params() 只是 return，媒体写出走 media_io.cpp 的 stbi_write_png(..., parameters)，
    # thirdparty/stb_image_write.h:1210 才把它落成 tEXt。所以这里读 IHDR + tEXt，
    # 并要求元数据里的尺寸与 IHDR 实际画布一致 —— 比看日志强：它同时证明参数被吃进去并被写进产物。
    # 所以能证明"我们传的参数真被用上了"，而不是"随便跑出一张图"。
    needs: discover
    # 45 → 60：多了一次常驻 sd-server 出图（模型再加载一遍 + 3 步 256x256 + 轮询）。
    # 仍是估的，第一次真跑要按实际耗时改回来。
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      WEIGHT_FILE: stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf
      WEIGHT_SIZE: "1566768416"
      WEIGHT_SHA256: b8944e9fe0b69b36ae1b5bb0185b3a7b8ef14347fe0fa9af6c64c4829022261f
    steps:
      - uses: actions/checkout@v4
        # 常驻服务那一步要调 tools/png_proof.py。
      - name: 下载引擎（discover 实时给的，digest 由上游 release 提供）
        run: |
          curl -sSL --fail --max-time 600 -o engine.zip "${{ needs.discover.outputs.sd_url }}"
          test "$(stat -c %s engine.zip)" = "${{ needs.discover.outputs.sd_size }}" || { echo "引擎体积不符"; exit 1; }
          echo "${{ needs.discover.outputs.sd_digest }}  engine.zip" | sha256sum -c -
          mkdir -p e && unzip -q engine.zip -d e
          echo "=== 包内布局（实测 Linux 包平铺根目录、二进制无扩展名、带一整套 .so）==="
          find e -maxdepth 2 | head -20
          BIN=$(find e -type f -name sd-cli | head -1)
          test -n "$BIN" || { echo "包里没有 sd-cli；同目录有："; ls -l "$(find e -type d | head -1)" | head -20; exit 1; }
          chmod +x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          export LD_LIBRARY_PATH="$(dirname "$BIN"):$LD_LIBRARY_PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          ldd "$BIN" | grep -i "not found" && { echo "动态库缺失"; exit 1; } || echo "动态库齐全"
          "$BIN" -h > "$RUNNER_TEMP/help.txt" 2>&1 < /dev/null || true
          grep -oE -- "--(diffusion-model|width|height|steps|output)\b" "$RUNNER_TEMP/help.txt" | sort -u
      - name: 取权重并按钉住的 sha256 复核
        run: |
          ok=""
          for u in "https://www.modelscope.cn/models/second-state/stable-diffusion-v1-5-GGUF/resolve/master/$WEIGHT_FILE" \
                   "https://hf-mirror.com/second-state/stable-diffusion-v1-5-GGUF/resolve/main/$WEIGHT_FILE"; do
            echo "试 $u"
            if curl -sSL --fail --max-time 2400 -o sd.gguf "$u"; then ok=yes; break; fi
          done
          test -n "$ok" || { echo "两个源都没下到权重"; exit 1; }
          test "$(stat -c %s sd.gguf)" = "$WEIGHT_SIZE" || { echo "权重体积不符"; exit 1; }
          echo "$WEIGHT_SHA256  sd.gguf" | sha256sum -c -
          head -c 4 sd.gguf | od -c | head -2 | sed 's/^/  文件头: /'
      - name: 生成一张小图，并要求日志证明参数生效
        run: |
          MODEL_ARG=--diffusion-model
          grep -q -- "--diffusion-model" "$RUNNER_TEMP/help.txt" || MODEL_ARG=-m
          echo "用 $MODEL_ARG 传模型"
          timeout 1800 "$BIN" "$MODEL_ARG" sd.gguf -p "a red cube on a table" \
            --steps 3 --width 256 --height 256 -o out.png -v > gen.log 2>&1 \
            || { echo "sd-cli 非零退出："; tail -30 gen.log; exit 1; }
          ls -l out.png || { echo "没产出 out.png"; tail -20 gen.log; exit 1; }
          python3 - <<'PY'
          import re, struct, sys
          with open("out.png", "rb") as fh:
              b = fh.read()
          print("PNG 头", b[:8].hex(), "字节数", len(b))
          if b[:8] != bytes([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]):
              sys.exit("产物不是合法 PNG（只查文件签名与块结构，不比像素——像素会因指令集/浮点差异而不同）")
          if len(b) < 1024:
              sys.exit("PNG 小得不正常，多半是空图")
          if b[12:16] != b"IHDR":
              sys.exit("PNG 第一个块不是 IHDR")
          w, h = struct.unpack(">II", b[16:24])
          print("IHDR 声明画布 =", w, "x", h)
          # 参数**不在日志里**：上游 examples/common/media_io.cpp 把 get_image_params() 的结果
          # 交给 stbi_write_png(..., parameters)，而 thirdparty/stb_image_write.h 把它写成
          # tEXt 块、关键字 "parameters"。所以这条判据读的是产物本身，不是 stdout。
          pos, chunks, texts = 8, [], []
          while pos + 8 <= len(b):
              ln = struct.unpack(">I", b[pos:pos + 4])[0]
              typ = b[pos + 4:pos + 8].decode("latin-1")
              body = b[pos + 8:pos + 8 + ln]
              chunks.append(typ)
              if typ == "tEXt" and b"\x00" in body:
                  kw, _, val = body.partition(b"\x00")
                  texts.append((kw.decode("latin-1"), val.decode("utf-8", "replace")))
              pos += 12 + ln
          print("块序列 =", chunks)
          params = dict(texts).get("parameters")
          if not params:
              print("关键字 =", [k for k, _ in texts] or "没有 tEXt")
              with open("gen.log", encoding="utf-8", errors="replace") as fh:
                  print("gen.log 尾部：", fh.read()[-400:])
              sys.exit('产物里没有 tEXt/parameters —— 元数据没嵌进去（sd-cli 默认嵌，只被 '
                       '--disable-image-metadata 关掉，车道没给那个旗标）')
          m = re.search(r"Steps:\s*(\d+)", params)
          s = re.search(r"Size:\s*(\d+)x(\d+)", params)
          print("parameters 里的 Steps =", m.group(1) if m else None,
                " Size =", s.group(0) if s else None)
          if not m or int(m.group(1)) != 3:
              sys.exit("产物元数据没体现 --steps 3：参数可能压根没吃进去")
          if not s or (int(s.group(1)), int(s.group(2))) != (w, h):
              sys.exit(f"元数据写的尺寸与 IHDR 的 {w}x{h} 不一致：{(s.groups() if s else None)}")
          if (w, h) != (256, 256):
              sys.exit(f"画布是 {w}x{h}，不是请求的 256x256")
          print("元数据片段 =", params[:220].replace("\n", " | "))
          PY
          echo "::notice::生图车道通过：引擎 ${{ needs.discover.outputs.sd_tag }} + 钉住的 Q4_0 权重，3 步 256x256 出合法 PNG"
      - name: 起常驻 sd-server，用异步任务接口再出一张图
        # 上面那条是 one-shot CLI。外壳要的是常驻服务（ADR 实现约束第 1 条），
        # 而 sd-server 这条路一次都没跑过 —— 尤其是"参数从 HTTP 请求体进去"这一节，
        # CLI 那一步证明不了它。所以这一步**故意不给 server 任何生成旗标**：
        # 上游默认是 20 步 / 512x512（examples/common/common.cpp 的选项表 + api.md 的
        # defaults 表），请求体里写 3 步 / 256x256，产物元数据与 IHDR 就必须是 3 与 256，
        # 否则红字直接说明"请求体没被吃掉"。
        # 契约逐个在 95b3090 源码里核过：
        #   监听旗标 --listen-ip / --listen-port（examples/server/runtime.cpp:193/198，默认 127.0.0.1:1234）
        #   模型**先加载完才 listen**（main.cpp:92-98 建上下文，:152 才 listen）
        #     —— 与 whisper-server 相反，那边是边加载边回 503，所以这里的探测不能照抄
        #   GET /v1/models = routes_openai.cpp:253（用来确认服务真在响应且模型在册）
        #   POST /sdcpp/v1/img_gen = routes_sdcpp.cpp:644，成功回 **202**（:695）+ poll_url（:693）
        #   GET /sdcpp/v1/jobs/{id} = :768，状态名 queued/generating/completed/failed/cancelled
        #     （async_jobs.cpp:73-88），完成时图在 result.images[].b64_json（:190/192-194）
        #   b64 由 async_jobs.cpp:284 产出，元数据按 :269-273 嵌进 PNG 的 tEXt
        run: |
          set -euo pipefail
          SRV=$(find e -type f -name sd-server | head -1)
          test -n "$SRV" || { echo "包里没有 sd-server，包里有什么："; find e -maxdepth 2 -type f | head -40; exit 1; }
          chmod +x "$SRV"
          "$SRV" --help > srv_help.txt 2>&1 < /dev/null || true
          # 模型旗标名在 CLI 与 server 之间可能不同，所以按 server 自己的 help 决定，不沿用上面算好的值。
          MODEL_ARG=--diffusion-model
          grep -q -- "--diffusion-model" srv_help.txt || MODEL_ARG=-m
          echo "用 $MODEL_ARG 传模型给 sd-server"
          PORT=1234
          LARGS=()
          if grep -q -- "--listen-port" srv_help.txt; then
            LARGS=(--listen-ip 127.0.0.1 --listen-port "$PORT")
          else
            echo "help 里没有 --listen-port，改用上游默认 127.0.0.1:1234（examples/server/runtime.cpp:198）"
          fi
          "$SRV" "$MODEL_ARG" sd.gguf ${LARGS[@]+"${LARGS[@]}"} > srv.log 2>&1 &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 90); do
            if curl -fsS --max-time 10 "http://127.0.0.1:$PORT/v1/models" 2>/dev/null | grep -q '"data"'; then
              ready=yes; break
            fi
            sleep 2
          done
          test -n "$ready" || { echo "sd-server 90 次探测（约 3 分钟）内没响应"; tail -40 srv.log; exit 1; }
          echo "::notice::sd-server 第 $i 次探测就绪（模型是加载完才 listen 的，能答就说明真就绪）"
          curl -fsS --max-time 30 http://127.0.0.1:$PORT/sdcpp/v1/capabilities > caps.json \
            || { echo "GET /sdcpp/v1/capabilities 失败"; tail -20 srv.log; exit 1; }
          python3 -c 'import json;d=json.load(open("caps.json",encoding="utf-8"));print("capabilities 顶层键 =",sorted(d)[:8])' \
            || { echo "capabilities 不是可解析的 JSON："; head -c 300 caps.json; exit 1; }
          CODE=$(curl -sS -o submit.json -w '%{http_code}' --max-time 60 \
                 -H 'Content-Type: application/json' \
                 -d '{"prompt":"a red cube on a table","width":256,"height":256,"seed":42,"sample_params":{"sample_steps":3}}' \
                 "http://127.0.0.1:$PORT/sdcpp/v1/img_gen")
          echo "提交任务返回 HTTP $CODE"
          test "$CODE" = 202 || { echo "不是 202（routes_sdcpp.cpp:695 写的是 202 Accepted）；响应体："; head -c 400 submit.json; exit 1; }
          POLL=$(python3 -c 'import json;print(json.load(open("submit.json",encoding="utf-8"))["poll_url"])')
          echo "轮询地址 = $POLL"
          STATUS=""
          for i in $(seq 1 240); do
            if curl -fsS --max-time 30 "http://127.0.0.1:$PORT$POLL" > job.json 2>/dev/null; then
              STATUS=$(python3 -c 'import json;print(json.load(open("job.json",encoding="utf-8")).get("status") or "")')
              case "$STATUS" in completed|failed|cancelled) break;; esac
            fi
            sleep 3
          done
          test "$STATUS" = completed || {
            echo "任务最终停在 status=${STATUS:-（一次都没读到）}，不是 completed"
            echo "最后一次响应："; head -c 400 job.json 2>/dev/null || true
            tail -30 srv.log; exit 1; }
          echo "任务在第 $i 次轮询完成"
          # 判据与 CLI 那条共用 tools/png_proof.py（它认 --b64-from 的 result.images[0].b64_json 形状）。
          python3 tools/png_proof.py --b64-from job.json --steps 3 --size 256x256
          echo "::notice::生图这条常驻服务路也通了（异步任务 → result.images[0].b64_json → 合法 PNG）"

  citation-drift:
    # 本轮所有硬结论都写成"上游某个 ref 的某一行写着某件事"（默认绑 loopback、CORS 默认 *、
    # SRT 由服务端渲染、--api-key 默认为空…）。而这一类断言恰恰最容易悄悄失效：上一轮就踩过
    # 六次"判据指向一个不存在的东西却照样跑完"（llama-completions、tag 里找 CLI、
    # -of jfk.srt、去日志里找 Steps:、grep tokens per second…）。所以把出处本身做成车道。
    # 不 needs discover：discover 一挂就会被标 skipped，结论看不见。
    timeout-minutes: 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 先跑离线对照（明知是错的必须被认成错）
        run: python3 tools/citation_check.py --selftest
      - name: 按 pin 住的 ref 逐条核对 file:line 的**那一行内容**
        run: python3 tools/citation_check.py --json /tmp/citations.json
      - name: 结论落盘并守住覆盖度
        run: |
          python3 - <<'PY'
          import json
          rows = json.load(open("/tmp/citations.json"))
          print(f"核对 {len(rows)} 条出处")
          if len(rows) < 20:
              raise SystemExit(f"覆盖度掉了：只核对到 {len(rows)} 条（应当 >=20，别拿少查当通过）")
          bad = [r for r in rows if not r["ok"]]
          for r in bad:
              print("  ✗", r["id"], r["problems"])
          if bad:
              raise SystemExit(f"{len(bad)} 条出处不再成立 —— 上游挪过行或改过默认值，"
                               f"要么重钉 ref 并复核结论，要么更正文档，不许改成 warning 放行")
          print("  全部出处仍然成立")
          PY

  headless-inference:
    needs: discover
    # 25 → 35：同一步里多起了一次常驻 server（权重要再加载一遍 + 最长 2 分钟的就绪轮询）。
    # 这两个数都是估的，第一次真跑要按实际耗时改回来（requirements.md 的"第一次真跑要盯什么"第 1 条）。
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      MODEL_REPO: Qwen/Qwen2.5-0.5B-Instruct-GGUF
      MODEL_FILE: qwen2.5-0.5b-instruct-q2_k.gguf
      MODEL_SHA256: 9ee36184e616dfc76df4f5dd66f908dbde6979524ae36e6cefb67f532f798cb8
      MODEL_SIZE: "415182688"
    steps:
      - name: 下载引擎（不编译）
        run: |
          curl -sSL --fail -o engine.tar.gz "${{ needs.discover.outputs.llama_url }}"
          mkdir -p engine && tar -xzf engine.tar.gz -C engine
          echo "=== 解出来的布局（用来确认上游目录约定） ==="
          find engine -maxdepth 3 | head -25
      - name: 定位可执行文件并抓 --help 作证
        run: |
          # 候选名来自 zip 中央目录实测（tools/zip_peek.py 读 llama-win-cpu-x64.zip 的条目表）：
          # 包里有 llama-cli / llama-completion / llama / llama-server，**没有** llama-simple 或 llama-completions。
          BIN=$(find engine -type f \( -name 'llama-cli' -o -name 'llama-completion' -o -name 'llama' \) | head -1)
          test -n "$BIN" || { echo "上游没有预期的可执行文件，需要更新选择逻辑"; exit 1; }
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          chmod +x "$BIN"
          ldd "$BIN" | grep -i "not found" && exit 1 || echo "动态库齐全"
          "$BIN" --help > help.txt 2>&1 < /dev/null || true
          echo "=== help 里与对话模式相关的开关 ==="
          grep -oE -- "--?(no-cnv|no-conversation(s)?|cnv|chat)" help.txt | sort -u || true
          head -12 help.txt
      - name: 下载模型并校验 sha256（pin）
        run: |
          curl -sSL --fail -o model.gguf "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE"
          test "$(stat -c %s model.gguf)" = "$MODEL_SIZE" || { echo "体积不符"; exit 1; }
          echo "$MODEL_SHA256  model.gguf" | sha256sum -c -
      - name: 无头推理，要求真的产出 token
        run: |
          FLAG=""
          # 候选名单按 b11727 的 common/arg.cpp:1907 补全 —— 那一版写的是 `-no-cnv` 与
          # `--no-conversation`（单数），上一版只试 `--no-cnv`/`--no-conversations`，
          # 两个都不存在，于是这条永远走"当作默认不进对话"的兜底分支。
          # 兜底本身也不要再依赖"上游大概默认关了对话"这种猜测：下面用 `< /dev/null`
          # 把 stdin 关掉，即使它真进了交互模式也会立刻 EOF 而不是挂到 timeout。
          for cand in -no-cnv --no-cnv --no-conversation --no-conversations; do
            if grep -qF -- "$cand" help.txt; then FLAG="$cand"; break; fi
          done
          echo "关闭对话模式的开关：[${FLAG:-help 里没有，靠 /dev/null 兜底}]"
          # 速率那一行不是白给的：b11727 的 llama-cli 只在 `--show-timings` 下打印
          # `[ Prompt: %.1f t/s | Generation: %.1f t/s ]`（tools/cli/cli-context.cpp:655-660），
          # 而库里那句 "tokens per second"（src/llama-context.cpp:4657）这个 CLI 根本不调。
          TIMING=""
          grep -qF -- "--show-timings" help.txt && TIMING=--show-timings
          echo "要速率行的开关：[${TIMING:-help 里没有 --show-timings}]"
          timeout 900 "$BIN" -m model.gguf ${FLAG:+"$FLAG"} ${TIMING:+"$TIMING"} -t 1 -ngl 0 -n 24 \
            -p "Reply with exactly one word: hello" > out.txt 2> err.txt < /dev/null
          echo "=== stderr 尾部 ==="; tail -8 err.txt
          echo "=== 输出 ==="; tail -5 out.txt
          # 两种写法都认（`t/s` 与 `tokens per second`），因为上游在 CLI 与库之间不一致；
          # 抓到 0 也别把结论说成"推理没跑起来"—— 那是两件事，下面用回复文本单独证明 token 真的产出了。
          RATE=$(grep -hoE '[0-9]+(\.[0-9]+)? *(tokens per second|t/s)' err.txt out.txt \
                 | grep -oE '[0-9]+(\.[0-9]+)?' | tail -1)
          test -n "$RATE" || {
            echo "没抓到速率行 —— 先分清是上游改了格式还是真没跑："; tail -30 err.txt
            echo "help 里与 timing/perf 相关的开关："; grep -oE -- "--?[a-z-]*(timings|perf)" help.txt | sort -u || true
            exit 1; }
          # 独立证据：模型确实吐了字（大小写与标点都不假设，只要有非空白内容）
          grep -qE '[^[:space:]]' out.txt || { echo "stdout 里没有任何文本，模型没产出 token"; exit 1; }
          awk -v r="$RATE" 'BEGIN{exit !(r>0)}' || { echo "速率为 0"; exit 1; }
          echo "::notice::无头推理成功 $RATE tok/s，引擎 ${{ needs.discover.outputs.llama_tag }}"
      - name: 起常驻 llama-server，走 OpenAI 兼容接口再产一次 token
        # ADR 的实现约束第 1 条是"外壳起常驻服务，而不是每个任务起一次进程"——
        # 但四条能力车道全是 one-shot CLI，那个决定一次都没被车道碰过。这条补上。
        # 路由与字段名按 b11727 源码核过，不是照 OpenAI 文档猜的：
        #   GET  /health                server.cpp:263（返回里带 "status"）
        #   POST /v1/chat/completions   server.cpp:274
        #   choices[].message.content   server-task.cpp:422/434
        #   usage.tokens_predicted      server-task.cpp:340
        # 服务二进制与 CLI 是**两个文件**（包里还有 libllama-server-impl.so 成对），
        # 所以这里自己 find llama-server 并带上 LD_LIBRARY_PATH，不复用上一步挑中的 CLI。
        run: |
          set -euo pipefail
          SRV=$(find engine -type f -name llama-server | head -1)
          test -n "$SRV" || { echo "包里没找到 llama-server，条目表："; find engine -maxdepth 2 -type f | head -30; exit 1; }
          chmod +x "$SRV"
          export LD_LIBRARY_PATH="$(dirname "$SRV")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$SRV" | grep -i "not found" && { echo "llama-server 动态库缺失"; exit 1; } || echo "llama-server 动态库齐全"
          "$SRV" -m model.gguf --host 127.0.0.1 --port 8080 -ngl 0 -c 1024 > server.log 2>&1 &
          SRV_PID=$!
          trap 'kill $SRV_PID 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "http://127.0.0.1:8080/health" 2>/dev/null | grep -q '"status"'; then
              ready=yes; break
            fi
            sleep 2
          done
          test -n "$ready" || { echo "server 60 次探测（约 2 分钟）内没就绪"; tail -40 server.log; exit 1; }
          echo "::notice::llama-server 第 $i 次探测就绪"
          curl -fsS --max-time 20 "http://127.0.0.1:8080/props" > props.json
          curl -fsS --max-time 300 -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"Reply with exactly one word: hello"}],"max_tokens":16,"temperature":0}' \
            "http://127.0.0.1:8080/v1/chat/completions" > chat.json
          python3 - <<'PY'
          import json


          def load(name):
              raw = open(name, encoding="utf-8", errors="replace").read()
              try:
                  return json.loads(raw), raw
              except Exception as e:
                  # 反代/网关给的常常是 HTML 502，那不是一个"接口形状变了"的故事，得说清楚
                  raise SystemExit(f"{name} 不是 JSON（{e}）：前 160 字节 = {raw[:160]!r}")


          props, _ = load("props.json")
          print("/props 键 =", sorted(props)[:10])
          d, raw = load("chat.json")
          if "error" in d:
              raise SystemExit(f"接口回了 error：{str(d['error'])[:200]}")
          ch = (d.get("choices") or [{}])[0]
          content = ((ch.get("message") or {}).get("content")) or ch.get("text") or ""
          print("content 长度 =", len(content), "片段 =", repr(content[:60]))
          usage = d.get("usage") or {}
          print("usage =", {k: usage[k] for k in sorted(usage)[:6]})
          if not content.strip():
              print("响应片段 =", raw[:200])
              raise SystemExit("常驻服务这条路上没拿到任何文本：与 one-shot 是不同的代码路径，不能当作已验")
          tp = usage.get("tokens_predicted")
          if tp is not None and not (tp > 0):
              raise SystemExit(f"usage.tokens_predicted={tp}，服务没真解码出 token")
          print("::notice::常驻 server 这条路通了（OpenAI 兼容 /v1/chat/completions）")
          PY
